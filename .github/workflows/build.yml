name: Windows Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        working-directory: PacketEditor
        run: dotnet publish PacketEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PacketEditor-win-x64
          path: PacketEditor/publish/PacketEditor.exe
          if-no-files-found: error
